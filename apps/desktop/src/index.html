<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grove</title>
    <link rel="stylesheet" href="/shared/appearance.css">
    <link rel="stylesheet" href="/shared/typography.css">
    <link rel="stylesheet" href="/shared/components.css">
    <link rel="stylesheet" href="/shared/controls.css">
    <link rel="stylesheet" href="/style.css">
    <script src="/shared/icons.js"></script>
    <script src="/shared/components.js"></script>
    <script src="/shared/controls.js"></script>
  </head>
  <body>
    <div class="workspace">
      <aside class="library" aria-label="회의 목록">
        <header class="library-header"><strong class="brand">Grove</strong><button id="create-meeting" class="primary with-icon" type="button" disabled>새 회의</button></header>
        <label class="search-field"><span class="sr-only">회의 검색</span><input id="search" type="search" placeholder="회의 검색" autocomplete="off"></label>
        <div class="library-heading"><h2>회의</h2><span id="meeting-count" class="muted type-caption"></span></div>
        <nav id="meeting-list" class="meeting-list" aria-label="저장한 회의"></nav>
        <footer class="library-footer"><span>온디바이스</span><button id="refresh" class="quiet small" type="button">새로고침</button></footer>
      </aside>
      <main class="main-content">
        <div id="error" class="notice app-error" role="alert" hidden><span id="error-message"></span><button id="retry-save" class="small" type="button" hidden>다시 저장</button><button id="dismiss-error" class="quiet small" type="button" aria-label="오류 안내 닫기">닫기</button></div>
        <section id="welcome" class="welcome"><div class="welcome-icon" aria-hidden="true"></div><h1>회의를 시작하세요</h1><p id="welcome-message">새 회의를 만들어 녹음하고 메모를 남기세요.</p><button id="welcome-create" class="primary with-icon" type="button" disabled>새 회의</button></section>
        <section id="meeting-detail" class="meeting-detail" hidden aria-label="회의 내용">
          <header class="detail-header"><div class="detail-context"><span id="meeting-date" class="muted type-caption"></span><span id="meeting-status"></span></div><label class="sr-only" for="meeting-title">회의 제목</label><input id="meeting-title" class="meeting-title" type="text" placeholder="회의 제목" maxlength="200" autocomplete="off"><div class="detail-actions"><span id="save-status" class="muted type-caption" role="status"></span><button id="save" class="quiet small" type="button" disabled>저장</button></div></header>
          <section class="recording-section" aria-label="녹음">
            <div class="recording-top"><div class="recording-heading"><span id="recording-icon" aria-hidden="true"></span><h2>녹음</h2><span id="recording-time" class="type-timer" hidden>00:00</span></div><button id="show-recorder" class="quiet small" type="button" hidden>작은 창</button></div>
            <div id="recording-controls" class="recording-controls"></div>
            <p id="recording-message" class="muted type-caption" hidden></p>
            <div id="audio-region" class="audio-region" hidden><audio id="audio-player" controls preload="metadata" aria-label="회의 녹음 재생"></audio><p id="audio-message" class="muted type-caption"></p></div>
          </section>
          <section class="notes-section"><div class="section-heading"><h2><label for="meeting-notes">메모</label></h2></div><textarea id="meeting-notes" placeholder="안건이나 기억할 내용을 적어 두세요." spellcheck="false"></textarea></section>
        </section>
      </main>
    </div>
    <dialog id="quit-dialog" class="quit-dialog" aria-labelledby="quit-title"></dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
